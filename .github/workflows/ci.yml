name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-quality:
    name: bun-quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@e59572c426373f5864ef1a6dad2524b47280a30c # v0.4.1
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@e59572c426373f5864ef1a6dad2524b47280a30c # v0.4.1
    permissions:
      contents: read

  quality:
    name: quality
    if: always()
    needs: [bun-quality, dependency-review]
    runs-on: ubuntu-latest

    steps:
      - name: Report quality failure
        if: needs.bun-quality.result != 'success' || needs.dependency-review.result != 'success'
        run: |
          echo "bun-quality: ${{ needs.bun-quality.result }}"
          echo "dependency-review: ${{ needs.dependency-review.result }}"
          exit 1

      - name: Report quality success
        if: needs.bun-quality.result == 'success' && needs.dependency-review.result == 'success'
        run: echo "bun-quality and dependency-review passed"
