name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: abijith-suresh/workflows/.github/workflows/ci.yml@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0

  dependency-review:
    name: dependency-review
    permissions:
      contents: read
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0

  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [ci, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        uses: abijith-suresh/workflows/.github/actions/gate@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0
        with:
          needs: ${{ toJSON(needs) }}
