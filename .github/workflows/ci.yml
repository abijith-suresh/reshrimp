name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: abijith-suresh/workflows/.github/workflows/ci.yml@a53b4c876bca362ca058c99c01c4c0a955d71c9d # 0.7.0

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [ci, dependency-review]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require CI and dependency review success
        shell: bash
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          if [[ "$CI_RESULT" != success || "$DEPENDENCY_REVIEW_RESULT" != success ]]; then
            echo "ci: $CI_RESULT" >&2
            echo "dependency-review: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
